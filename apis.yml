aid: spaitial
name: SpAItial
description: >-
  SpAItial (SpAItial Ltd, London) is a frontier spatial-AI lab building Echo, a
  world-model family that turns text prompts, images, and 360-degree panoramas
  into persistent, explorable 3D Gaussian Splat worlds (SPZ/SOG, plus mesh
  exports). SpAItial ships a public REST Developer API at api.spaitial.ai for
  programmatic world generation, panorama editing, file upload, and mesh export,
  an official hosted Model Context Protocol (MCP) server for AI agents, and an
  installable Agent Skill for coding assistants. It is a portfolio company of
  Speedinvest. This profile was enriched from the live OpenAPI spec, docs,
  llms.txt, and MCP server card.
