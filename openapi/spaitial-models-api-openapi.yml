openapi: 3.2.0
info:
  title: SpAItial Developer Models API
  description: Programmatic API for generating 3D worlds. See the Getting Started guide for authentication and usage examples.
  version: 1.0.0
  contact: {}
servers:
- url: https://api.spaitial.ai
  description: Production
tags:
- name: Models
  description: Model discovery endpoints
paths:
  /v1/models:
    get:
      operationId: V1Models_listModels
      parameters: []
      responses:
        '200':
          description: List of available models for world generation
        '401':
          description: Unauthorized
      security:
      - api-key: []
      summary: List available models
      tags:
      - Models
      servers:
      - url: https://api.spaitial.ai
        description: Production
components:
  securitySchemes:
    api-key:
      scheme: bearer
      bearerFormat: API Key
      type: http
      description: 'API key issued by the developers site. Example: spt_live_abc123...'
